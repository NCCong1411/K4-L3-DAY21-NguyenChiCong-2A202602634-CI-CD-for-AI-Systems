name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - "data/**.dvc"
      - "src/**.py"
      - "tests/**.py"
      - "deploy/**"
      - "params.yaml"
      - "requirements.txt"
      - ".github/workflows/cicd.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: income-model-production
  cancel-in-progress: false

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        env:
          MLFLOW_TRACKING_URI: ""
        run: pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure remote MLflow when DagsHub secrets exist
        env:
          TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          if [ -n "$TRACKING_URI" ]; then
            echo "MLFLOW_TRACKING_URI=$TRACKING_URI" >> "$GITHUB_ENV"
            echo "MLFLOW_TRACKING_USERNAME=$TRACKING_USERNAME" >> "$GITHUB_ENV"
            echo "MLFLOW_TRACKING_PASSWORD=$TRACKING_PASSWORD" >> "$GITHUB_ENV"
          fi
          echo "MLFLOW_EXPERIMENT_NAME=adult-income-cicd" >> "$GITHUB_ENV"

      - name: Pull training data with DVC
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model and generate reports
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          f1=$(python -c "import json; print(json.load(open('outputs/report.json'))['f1_score'])")
          echo "f1=$f1" >> "$GITHUB_OUTPUT"
          echo "Optimized F1: $f1"

      - name: Upload candidate to S3
        run: |
          prefix="s3://${{ vars.ARTIFACT_BUCKET }}/artifacts/candidates/${GITHUB_SHA}"
          aws s3 cp models/model.joblib "$prefix/model.joblib" --sse AES256
          aws s3 cp outputs/report.json "$prefix/report.json" --sse AES256
          aws s3 cp outputs/detail.txt "$prefix/detail.txt" --sse AES256

      - name: Save reports as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: training-reports-${{ github.sha }}
          path: |
            outputs/report.json
            outputs/detail.txt

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Require F1 score of at least 0.65
        env:
          MODEL_F1: ${{ needs.train.outputs.f1 }}
        run: |
          python - <<'PYEOF'
          import os

          f1 = float(os.environ["MODEL_F1"])
          if f1 < 0.65:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < 0.65. Deployment blocked.")
          print(f"PASSED: f1_score {f1:.4f} >= 0.65.")
          PYEOF

  release:
    name: Release
    needs: [train, quality-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Compare candidate with production
        id: compare
        env:
          NEW_F1: ${{ needs.train.outputs.f1 }}
        run: |
          if aws s3 cp "s3://${{ vars.ARTIFACT_BUCKET }}/artifacts/current/report.json" current-report.json; then
            old_f1=$(python -c "import json; print(json.load(open('current-report.json'))['f1_score'])")
            echo "Current F1: $old_f1"
            echo "Candidate F1: $NEW_F1"
            if python -c "import sys; sys.exit(0 if float('$NEW_F1') >= float('$old_f1') else 1)"; then
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
              echo "Candidate is at least as good as production."
            else
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              echo "Rollback guard: candidate is worse; production remains unchanged."
            fi
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "No production report exists; allowing the first release."
          fi

      - name: Promote candidate artifacts
        if: steps.compare.outputs.should_deploy == 'true'
        run: |
          candidate="s3://${{ vars.ARTIFACT_BUCKET }}/artifacts/candidates/${GITHUB_SHA}"
          current="s3://${{ vars.ARTIFACT_BUCKET }}/artifacts/current"
          aws s3 cp "$candidate/model.joblib" "$current/model.joblib" --sse AES256
          aws s3 cp "$candidate/report.json" "$current/report.json" --sse AES256
          aws s3 cp "$candidate/detail.txt" "$current/detail.txt" --sse AES256

      - name: Deploy through Systems Manager
        if: steps.compare.outputs.should_deploy == 'true'
        run: |
          deploy_command="runuser -u ubuntu -- git -C /opt/income-api/repo fetch --prune origin main && runuser -u ubuntu -- git -C /opt/income-api/repo checkout --force '${GITHUB_SHA}' && bash /opt/income-api/repo/deploy/install_service.sh '${{ vars.ARTIFACT_BUCKET }}' '${{ vars.AWS_REGION }}'"
          parameters=$(jq -cn --arg command "$deploy_command" '{commands:[$command]}')
          command_id=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "Deploy Income API ${GITHUB_SHA}" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)

          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" || true

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" > invocation.json
          cat invocation.json
          status=$(jq -r '.Status' invocation.json)
          test "$status" = "Success"

      - name: Report rollback guard decision
        if: steps.compare.outputs.should_deploy == 'false'
        run: echo "Release completed without deployment; the previous model remains active."
